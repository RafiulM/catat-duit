services:
  postgres:
    image: postgres:17-alpine
    container_name: catatduit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: catatduit
      POSTGRES_PASSWORD: catatduit
      POSTGRES_DB: catatduit
    ports:
      - "5435:5432"
    volumes:
      - catatduit_pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catatduit -d catatduit"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  catatduit_pgdata:
